<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><link rel="manifest" href="/manifest.webmanifest">
<title>Judgment Speed Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs" type="module"></script>
<style>
:root{--bg:#0b0f14;--panel:#121923;--panel2:#0f151e;--line:#253142;--text:#e9eef5;--muted:#8e9bab;--accent:#79a9ff;--danger:#ff7f7f}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button,input{background:#0d131b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px}button{cursor:pointer}button.primary{background:var(--accent);color:#07101d;border:0;font-weight:700}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:8px}.brand{font-weight:750;white-space:nowrap}.top .citation{flex:1;max-width:310px}.layout{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,1fr)}.pane{min-width:0;overflow:auto}.reader{border-right:1px solid var(--line);padding:12px}.analysis{padding:12px}.tools{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);padding-bottom:10px}.row{display:flex;gap:7px;align-items:center}.row>*{min-width:0}.search{flex:1}.toolbar{margin-top:7px;overflow:auto}.toolbar button{white-space:nowrap}.source{max-width:900px;margin:auto}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.drop{border:1px dashed #41516a;border-radius:12px;padding:24px;margin-top:20px}.p{line-height:1.72;margin:0 0 10px;padding:8px;border-radius:7px;scroll-margin-top:85px}.p.active{outline:1px solid var(--accent);background:#14243a}.pn{color:var(--muted);font-size:11px;margin-right:5px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px}.card h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid var(--line);padding:4px 7px;border-radius:999px;font-size:12px}.issue{border-top:1px solid var(--line);padding:9px 0}.issue:first-child{border-top:0}.key{cursor:pointer}.muted{color:var(--muted)}.small{font-size:11px}.order{font-weight:750}.mode button.on{border-color:var(--accent);color:var(--accent)}mark{background:#f0d35c;color:#17130a;border-radius:2px;padding:0 1px}.pdf-wrap{background:#333;padding:12px;min-height:100px}.pdf-page{background:white;box-shadow:0 2px 12px #0006;margin:0 auto 12px;position:relative}.pdf-page canvas{display:block;width:100%;height:auto}.pdf-label{position:absolute;top:5px;right:6px;background:#000b;color:#fff;padding:2px 5px;border-radius:4px;font-size:10px}.status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mobile-tabs{display:none}
@media(max-width:800px){.top{height:auto;min-height:56px;flex-wrap:wrap;padding:8px;padding-top:max(8px,env(safe-area-inset-top))}.brand{width:auto}.top .citation{order:3;flex-basis:100%;max-width:none}.layout{grid-template-columns:1fr}.analysis{display:none}.analysis.show{display:block}.reader.hide{display:none}.mobile-tabs{display:flex;position:sticky;top:0;z-index:20;background:var(--bg);padding:6px;gap:6px}.mobile-tabs button{flex:1}.layout.analysis-open .reader{display:none}.layout.analysis-open .analysis{display:block}.tools{top:0}.reader{border-right:0;padding:8px}.analysis{padding:8px}.drop{padding:18px}.p{font-size:15px;line-height:1.75}.pdf-wrap{padding:6px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">Judgment Speed Reader</div><input id="citation" class="citation" placeholder="2026 INSC 915"><button id="lookup">Lookup</button><input id="file" type="file" accept="application/pdf" hidden><button id="pdfBtn">PDF</button><button id="paste">Paste</button></header>
<div class="mobile-tabs"><button id="readerTab" class="primary">Judgment</button><button id="analysisTab">Breakdown</button></div>
<main id="layout" class="layout"><section id="reader" class="pane reader"><div class="tools"><div class="row"><input id="find" class="search" placeholder="Search judgment…"><button id="analyze" class="primary">Analyze</button></div><div class="row toolbar"><div class="mode"><button data-mode="full" class="on">Full</button><button data-mode="skim">Skim</button><button data-mode="key">Key</button><button data-mode="head">TL;DR</button></div><span id="status" class="muted small status">No judgment loaded</span></div></div><div id="source" class="source"><div class="drop"><b>Load one judgment</b><br><span class="muted">PDF keeps its original visual layout. Text mode is used when you paste a judgment.</span></div></div></section><section id="analysis" class="pane analysis"><div id="out" class="empty">Analyze a judgment to generate its structured breakdown.</div></section></main></div>
<script type="module">
const pdfjsLib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.mjs';
let raw='',data=null,mode='full',pdfBytes=null,pdfDoc=null,paragraphs=[],isPdf=false;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(x){$('status').textContent=x}
$('pdfBtn').onclick=()=>$('file').click(); $('paste').onclick=()=>{const t=prompt('Paste the judgment text');if(t)loadText(t)};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;setStatus('Extracting PDF…');const fd=new FormData();fd.append('pdf',f);const r=await fetch('/api/pdf',{method:'POST',body:fd});const j=await r.json();if(j.error)return alert(j.error);raw=j.text;paragraphs=j.paragraphs;pdfBytes=Uint8Array.from(atob(j.pdfBase64),c=>c.charCodeAt(0));isPdf=true;data=null;await renderPdf();setStatus(`${paragraphs.length} paragraphs · ${f.name}`)};
function loadText(t){raw=t;paragraphs=makeParagraphs(t);pdfBytes=null;isPdf=false;renderText();setStatus(`${paragraphs.length} paragraphs loaded`)}
function makeParagraphs(t){return t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map((text,i)=>({n:i+1,text}))}
function skim(t){return t.split(/(?<=[.!?])\s+/).map((x,i)=>i===0||/\b(held|we are of the view|it is well settled)\b|\b(?:section|rule|article)\s+\d+|\b\d{4}\b/i.test(x)?`<b>${esc(x)}</b>`:esc(x)).join(' ')}
function highlight(t,q){if(!q)return esc(t);const safe=esc(t);const re=new RegExp('('+q.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+')','gi');return safe.replace(re,'<mark>$1</mark>')}
function renderText(){const q=$('find').value.trim();$('source').innerHTML=paragraphs.map(p=>`<p class="p" id="p-${p.n}"><span class="pn">¶${p.n}</span>${mode==='skim'?skim(p.text):highlight(p.text,q)}</p>`).join('')||'<div class="drop">No text.</div>'; if(mode==='key'&&data)showKeyText(); if(mode==='head'&&data)showTldr()}
async function renderPdf(){if(!pdfBytes)return;pdfDoc=await pdfjsLib.getDocument({data:pdfBytes}).promise;const wrap=document.createElement('div');wrap.className='pdf-wrap';for(let n=1;n<=pdfDoc.numPages;n++){const page=await pdfDoc.getPage(n);const base=page.getViewport({scale:1});const maxW=Math.min(window.innerWidth*.96,900);const scale=Math.max(.7,Math.min(2,maxW/base.width));const vp=page.getViewport({scale});const box=document.createElement('div');box.className='pdf-page';box.id='page-'+n;const canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;canvas.style.width='100%';box.append(canvas);const label=document.createElement('div');label.className='pdf-label';label.textContent='Page '+n;box.append(label);wrap.append(box);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;}$('source').innerHTML='';$('source').append(wrap)}
$('find').oninput=()=>{if(!isPdf)renderText();else{const q=$('find').value.toLowerCase();document.querySelectorAll('.pdf-page').forEach(p=>p.classList.toggle('active',false));if(q){const hit=paragraphs.find(p=>p.text.toLowerCase().includes(q));if(hit)jump(hit.n)}}};
$('analyze').onclick=async()=>{if(!raw)return alert('Load a judgment first.');setStatus('Gemini is analyzing…');const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:raw})});const j=await r.json();if(j.error)return alert(j.error);data=j.analysis;paragraphs=j.paragraphs;renderAnalysis();setStatus('Analysis complete');if(isPdf)renderPdf();else renderText()};
function renderAnalysis(){const d=data;$('out').className='';$('out').innerHTML=`<div class="card"><h2>Citation & Bench</h2><b>${esc(d.citation.case_name)}</b><div class="muted">${esc(d.citation.neutral_citation)} · ${esc(d.citation.court)} · ${esc(d.citation.date)}</div><div>${(d.citation.coram||[]).map(esc).join(' · ')}</div></div><div class="card"><h2>Parties</h2><div><b>Appellant/Petitioner:</b> ${esc(d.parties.appellant_or_petitioner)}</div><div><b>Respondent:</b> ${esc(d.parties.respondent)}</div></div><div class="card"><h2>Headnote</h2><p>${esc(d.headnote)}</p></div><div class="card"><h2>Statutes & Sections</h2><div class="chips">${(d.statutes||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div><div class="card"><h2>Issues & Holdings</h2>${(d.issues||[]).map((x,i)=>`<div class="issue"><b>${i+1}. ${esc(x)}</b><div class="muted">Holding: ${esc((d.holdings||[])[i]||'')}</div></div>`).join('')}</div><div class="card"><h2>Final Order</h2><div class="order">${esc(d.final_order)}</div></div><div class="card"><h2>Key Paragraphs</h2>${(d.key_paragraphs||[]).map(k=>`<div class="issue key" onclick="jump(${Number(k.paragraph_number)})"><b>¶${esc(k.paragraph_number)} — ${esc(k.importance)}</b><div>${esc(k.reason)}</div><div class="muted small">${esc(k.excerpt)}</div></div>`).join('')}</div>`}
function showKeyText(){const nums=new Set((data?.key_paragraphs||[]).map(k=>Number(k.paragraph_number)));$('source').innerHTML=paragraphs.filter(p=>nums.has(p.n)).map(p=>`<p class="p" id="p-${p.n}"><span class="pn">¶${p.n}</span>${mode==='skim'?skim(p.text):highlight(p.text,$('find').value.trim())}</p>`).join('')||'<div class="drop">No key paragraphs available.</div>'}
function showTldr(){const d=data;$('source').innerHTML=`<div class="card"><h2>Headnote</h2><p>${esc(d.headnote)}</p></div><div class="card"><h2>Issues + Holding</h2>${(d.issues||[]).map((x,i)=>`<div class="issue"><b>${esc(x)}</b><div class="muted">${esc(d.holdings?.[i]||'')}</div></div>`).join('')}</div>`}
window.jump=async n=>{if(isPdf){const target=paragraphs.find(p=>p.n===Number(n));if(!target)return;const needle=target.text.replace(/\s+/g,' ').slice(0,90).toLowerCase();let found=null;for(let pageNo=1;pageNo<=pdfDoc.numPages&&!found;pageNo++){const page=await pdfDoc.getPage(pageNo);const c=await page.getTextContent();const text=c.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').toLowerCase();if(text.includes(needle)||needle.split(' ').slice(0,8).join(' ')&&text.includes(needle.split(' ').slice(0,8).join(' ')))found=pageNo}if(found){document.getElementById('page-'+found)?.scrollIntoView({behavior:'smooth',block:'start'});}}else{const el=document.getElementById('p-'+n);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('active');setTimeout(()=>el.classList.remove('active'),1600)}}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));if(mode==='key'&&data)showKeyText();else if(mode==='head'&&data)showTldr();else if(isPdf)renderPdf();else renderText()});
$('readerTab').onclick=()=>{$('layout').classList.remove('analysis-open')};$('analysisTab').onclick=()=>{$('layout').classList.add('analysis-open')};
$('lookup').onclick=()=>{const c=$('citation').value.trim();if(!c)return;window.open('https://www.google.com/search?q='+encodeURIComponent('"'+c+'" Supreme Court India judgment'),'_blank','noopener')};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
